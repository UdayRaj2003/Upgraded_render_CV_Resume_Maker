design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 0.18in
    bottom_margin: 0.18in
    left_margin: 0.26in
    right_margin: 0.26in
    show_footer: false
    show_top_note: false
  typography:
    font_family:
      body: Times New Roman
      name: Times New Roman
      headline: Times New Roman
      connections: Times New Roman
      section_titles: Times New Roman
    font_size:
      name: 19pt
      body: 10pt
      section_titles: 12pt
      connections: 10pt
    line_spacing: 0.26em
    bold:
      name: true
  header:
    connections:
      separator: " | "
      show_icons: false
      display_urls_instead_of_usernames: true
  colors:
    name: rgb(31,78,121)
    connections: rgb(34,34,34)
    headline: rgb(31,78,121)
    section_titles: rgb(31,78,121)
    links: rgb(5,99,193)
  links:
    underline: false
    show_external_link_icon: false
  section_titles:
    type: with_full_line
    space_above: 6pt
    space_below: 3.5pt
  sections:
    space_between_regular_entries: 4.5pt
    space_between_text_based_entries: 2.5pt
    show_time_spans_in: []
  entries:
    short_second_row: false
    summary:
      space_above: 0pt
    side_space: 0cm
    highlights:
      bullet: "○"
      space_left: 15pt
      space_above: 1.2pt
      space_between_items: 1.5pt
      space_between_bullet_and_text: 0.25em
  templates:
    education_entry:
      main_column: "#text(fill: rgb(\"1f4e79\"))[•] #text(fill: rgb(\"2e75b6\"))[**INSTITUTION**], LOCATION --- *DEGREE*\nAREA\nHIGHLIGHTS"
      date_and_location_column: '#text(fill: rgb("555555"))[DATE]'
    experience_entry:
      main_column: "#text(fill: rgb(\"1f4e79\"))[•] #text(fill: rgb(\"2e75b6\"))[**COMPANY**], LOCATION --- *POSITION*\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: '#text(fill: rgb("555555"))[DATE]'
    normal_entry:
      main_column: "#text(fill: rgb(\"1f4e79\"))[•] #text(fill: rgb(\"2e75b6\"))[**NAME**] --- *SUMMARY*\nHIGHLIGHTS"
      date_and_location_column: '#text(fill: rgb("555555"))[DATE]'
    one_line_entry:
      main_column: '#text(fill: rgb("1f4e79"))[•] **LABEL:** DETAILS'

design:
  theme: classic
  page:
    size: us-letter
    top_margin: 0.15in
    bottom_margin: 0.3in
    left_margin: 0.35in
    right_margin: 0.35in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(0, 0, 0)
    top_note: rgb(0, 0, 0)
  typography:
    line_spacing: 0.5em
    alignment: left
    date_and_location_column_alignment: left
    font_family:
      body: Calibri
      name: Calibri
      headline: Calibri
      connections: Calibri
      section_titles: Calibri
    font_size:
      body: 10pt
      name: 12pt
      headline: 10pt
      connections: 10pt
      section_titles: 12pt
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    space_below_name: 0.08cm
    space_below_headline: 0.05cm
    space_below_connections: 0.12cm
    connections:
      phone_number_format: E164
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: false
      separator: ','
      space_between_connections: 0.12cm
  section_titles:
    type: without_line
    line_thickness: 0pt
    space_above: 0.16cm
    space_below: 0.06cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.14cm
    space_between_text_based_entries: 0.04cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 0cm
    side_space: 0cm
    space_between_columns: 0cm
    allow_page_break: true
    short_second_row: false
    degree_width: 0cm
    summary:
      space_above: 0.02cm
      space_left: 0cm
    highlights:
      bullet: '-'
      nested_bullet: '-'
      space_left: 0cm
      space_above: 0.02cm
      space_between_items: 0.02cm
      space_between_bullet_and_text: 0.25em
  templates:
    single_date: MONTH_NAME YEAR
    date_range: START_DATE to END_DATE
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **DEGREE**
        INSTITUTION, LOCATION, DATE, AREA
      degree_column:
      date_and_location_column: ''
    normal_entry:
      main_column: |-
        **NAME** — SUMMARY, DATE
        HIGHLIGHTS
      date_and_location_column: ''
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY, LOCATION, DATE
        HIGHLIGHTS
      date_and_location_column: ''
settings:
  pdf_title: Uday Raj Gupta - Resume
locale:
  language: english
